<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#f2f2f7;font-family:-apple-system,"SF Pro Text",Helvetica,Arial,sans-serif;color:#1c1c1e}
.w{max-width:420px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 48px) 24px 40px;text-align:center}
.lg{width:84px;height:84px;border-radius:20px;margin:0 auto 14px;display:block}
h1{font-size:26px;margin:0 0 6px}p{color:#6c6c70;line-height:1.45;margin:0 0 18px;font-size:15px}
input{width:100%;font-size:18px;padding:14px;border:1px solid #d1d1d6;border-radius:12px;background:#fff;margin:0 0 12px;text-align:center;-webkit-appearance:none}
input.c{letter-spacing:6px;font-size:24px}
button{width:100%;font-size:17px;font-weight:600;padding:14px;border:0;border-radius:12px;background:#007aff;color:#fff}
button[disabled]{opacity:.5}.sec{background:none;color:#007aff;font-weight:500;margin-top:6px}
.err{color:#d70015;min-height:20px;margin:0 0 10px;font-size:14px}.ok{color:#248a3d}
.box{background:#fff;border-radius:14px;padding:16px;text-align:left;font-size:15px;line-height:1.5;color:#1c1c1e;margin:0 0 14px}
.box b{display:block;margin-bottom:6px}.id{font-family:ui-monospace,Menlo,monospace;font-size:13px;color:#8e8e93;margin-top:22px}
</style></head><body>
<div class="w" id="root"><img class="lg" id="ic0" alt=""><h1>AnkiPhone</h1><p id="msg">Yuklanmoqda…</p></div>
<script>
(function(){
var SCRIPT_URL='https://script.google.com/macros/s/AKfycbxJSXbAL2Pk7GbeSQ1iEKqhWbNtWlCEZ27TOEgR_Md-o3PaoAGmpKif2Mptr6ht0tA/exec';
var ls={g:function(k){try{return localStorage.getItem(k)}catch(e){return null}},s:function(k,v){try{localStorage.setItem(k,v)}catch(e){}},d:function(k){try{localStorage.removeItem(k)}catch(e){}}};
var root=document.getElementById('root');
var dev=ls.g('ap_dev');if(!dev){dev=(Math.random().toString(36).slice(2,6)+Math.random().toString(36).slice(2,6)).toUpperCase();ls.s('ap_dev',dev)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
var ICON=document.querySelector('link[rel=apple-touch-icon]').href;document.getElementById('ic0').src=ICON;
function head(m){return '<img class="lg" src="'+ICON+'" alt=""><h1>AnkiPhone</h1><p>'+m+'</p>'}
function api(q){return fetch(SCRIPT_URL+'?'+q,{cache:'no-store'}).then(function(r){return r.json()})}
function b64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
function decrypt(enc,key){
  var raw=b64(enc.replace(/\s/g,'')),iv=raw.slice(0,12),ct=raw.slice(12);
  return crypto.subtle.importKey('raw',b64(key),'AES-GCM',false,['decrypt']).then(function(k){
    return crypto.subtle.decrypt({name:'AES-GCM',iv:iv},k,ct)}).then(function(p){return new TextDecoder().decode(p)});
}
function wipe(){ls.d('ap_tok');ls.d('ap_key')}
var ios=/iPhone|iPad|iPod/.test(navigator.userAgent),standalone=navigator.standalone===true||(window.matchMedia&&matchMedia('(display-mode: standalone)').matches);
var override=/[?&]safari=1/.test(location.search);

function start(){
  var tok=ls.g('ap_tok'),key=ls.g('ap_key');
  var ctl=function(){return fetch('app.enc.txt',{cache:'no-cache'}).then(function(r){if(!r.ok)throw 0;return r.text()}).then(function(t){ls.s('ap_enc',t);return t})}
  ctl().catch(function(){return ls.g('ap_enc')}).then(function(enc){
    if(!enc){root.innerHTML=head('Birinchi ochilishda internet kerak. Internetni yoqib, qayta oching.');return}
    return decrypt(enc,key).then(function(html){
      // ruxsat bekor qilinganini fonda tekshirish
      api('action=check&token='+encodeURIComponent(tok)).then(function(j){
        if(j&&j.ok===false&&j.err==='revoked'){wipe();ls.d('ap_enc');location.reload()}
      }).catch(function(){});
      document.open();document.write(html);document.close();
    },function(){wipe();gate()});
  });
}

function gate(){
  if(ios&&!standalone&&!override){
    root.innerHTML=head('Avval ilovani bosh ekranga qo’shing, so’ng shu belgidan oching.')+
    '<div class="box"><b>Qanday?</b>1. Safari pastidagi <b style="display:inline">Ulashish</b> tugmasini bosing.<br>2. <b style="display:inline">Add to Home Screen</b> ni tanlang va <b style="display:inline">Add</b> bosing.<br>3. Bosh ekrandagi AnkiPhone belgisini oching.</div>'+
    '<p>Kirishni faqat shu belgidan so’rang, aks holda ma’lumotlar saqlanmaydi.</p>';
    return;
  }
  var pend=ls.g('ap_pend');
  pend?stepCode():stepAsk();
}

function stepAsk(msg){
  root.innerHTML=head('Ilovaga kirish uchun ruxsat kerak. Ismingizni yozing va kirishni so’rang: kod ilova egasiga yuboriladi.')+
  '<input id="nm" placeholder="Ismingiz" maxlength="40" autocomplete="name" value="'+esc(ls.g('ap_name')||'')+'">'+
  '<div class="err" id="er">'+(msg||'')+'</div><button id="go">Kirishni so’rash</button><button class="sec" id="have">Kodim bor</button>'+
  '<div class="id">Qurilma: '+esc(dev)+'</div>';
  document.getElementById('have').onclick=stepCode;
  document.getElementById('go').onclick=function(){
    var n=document.getElementById('nm').value.trim();if(!n){document.getElementById('er').textContent='Ismingizni yozing.';return}
    ls.s('ap_name',n);var b=this;b.disabled=true;b.textContent='Yuborilmoqda…';
    api('action=request&device='+encodeURIComponent(dev)+'&name='+encodeURIComponent(n)).then(function(j){
      if(j.ok){ls.s('ap_pend','1');stepCode(true)}
      else{b.disabled=false;b.textContent='Kirishni so’rash';document.getElementById('er').textContent=
        j.err==='too_many'?'Juda ko’p so’rov. Bir ozdan keyin urinib ko’ring.':'Xatolik, keyinroq urinib ko’ring.'}
    }).catch(function(){b.disabled=false;b.textContent='Kirishni so’rash';document.getElementById('er').textContent='Internet yo’q yoki server javob bermadi.'});
  };
}

function stepCode(sent,msg){
  root.innerHTML=head(sent===true?'So’rov yuborildi. Kodni ilova egasidan so’rang va pastga kiriting (15 daqiqa amal qiladi).':'Ilova egasi bergan 6 xonali kodni kiriting.')+
  '<input class="c" id="cd" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="······" autocomplete="one-time-code">'+
  '<div class="err" id="er">'+(msg||'')+'</div><button id="go">Kirish</button><button class="sec" id="again">Kodni qayta so’rash</button>'+
  '<div class="id">Qurilma: '+esc(dev)+'</div>';
  document.getElementById('again').onclick=function(){ls.d('ap_pend');stepAsk()};
  document.getElementById('go').onclick=function(){
    var c=document.getElementById('cd').value.trim();if(c.length<6){document.getElementById('er').textContent='6 ta raqam kiriting.';return}
    var b=this;b.disabled=true;b.textContent='Tekshirilmoqda…';
    api('action=verify&device='+encodeURIComponent(dev)+'&code='+encodeURIComponent(c)).then(function(j){
      if(j.ok){ls.s('ap_tok',j.token);ls.s('ap_key',j.key);ls.d('ap_pend');start()}
      else{b.disabled=false;b.textContent='Kirish';
        var m={wrong:'Kod noto’g’ri'+(j.left!=null?' (qolgan urinish: '+j.left+')':'')+'.',expired:'Kod muddati tugagan. Qayta so’rang.',locked:'Urinishlar tugadi. Kodni qayta so’rang.',no_code:'Kod topilmadi. Avval kirishni so’rang.'}[j.err]||'Xatolik, keyinroq urinib ko’ring.';
        document.getElementById('er').textContent=m}
    }).catch(function(){b.disabled=false;b.textContent='Kirish';document.getElementById('er').textContent='Internet yo’q yoki server javob bermadi.'});
  };
}

if(!window.crypto||!crypto.subtle){root.innerHTML=head('Bu brauzer qo’llab-quvvatlanmaydi. Safari yoki Chrome’dan foydalaning.')}
else if(ls.g('ap_tok')&&ls.g('ap_key'))start();else gate();
})();
</script></body></html>
