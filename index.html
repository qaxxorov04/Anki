<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Anki">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f2f2f7">
<title>My Anki</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Раскладка: iOS-список колод, экран повторения с нижней панелью ответов, как в AnkiMobile */
:root{
  --bg:#f2f2f7; --cell:#ffffff; --fg:#000000; --fg2:#6c6c70; --sep:rgba(60,60,67,.2);
  --blue:#007aff; --red:#ff3b30; --green:#2fb344; --orange:#ff9500; --fill:rgba(120,120,128,.12);
  --bar:rgba(249,249,249,.96); --cardbg:#ffffff;
  --again:rgba(255,59,48,.14); --hard:rgba(255,149,0,.16); --good:rgba(47,179,68,.16); --easy:rgba(0,122,255,.14);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --cell:#1c1c1e; --fg:#ffffff; --fg2:#98989f; --sep:rgba(84,84,88,.55);
  --blue:#0a84ff; --red:#ff453a; --green:#30d158; --orange:#ff9f0a; --fill:rgba(120,120,128,.24);
  --bar:rgba(28,28,30,.96); --cardbg:#1c1c1e;
  --again:rgba(255,69,58,.22); --hard:rgba(255,159,10,.22); --good:rgba(48,209,88,.22); --easy:rgba(10,132,255,.24);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --cell:#1c1c1e; --fg:#ffffff; --fg2:#98989f; --sep:rgba(84,84,88,.55);
  --blue:#0a84ff; --red:#ff453a; --green:#30d158; --orange:#ff9f0a; --fill:rgba(120,120,128,.24);
  --bar:rgba(28,28,30,.96); --cardbg:#1c1c1e;
  --again:rgba(255,69,58,.22); --hard:rgba(255,159,10,.22); --good:rgba(48,209,88,.22); --easy:rgba(10,132,255,.24);
  color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:17px;line-height:1.3;-webkit-text-size-adjust:100%;touch-action:manipulation;overflow:hidden}
button,input,label{font-family:inherit;touch-action:manipulation}
button{cursor:pointer}
#app{height:100%}
.boot{height:100%;display:flex;align-items:center;justify-content:center;color:var(--fg2)}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.screen{display:flex;flex-direction:column;height:100%;min-height:0}
.nav,.st-top{flex:none;background:var(--bar);border-bottom:.5px solid var(--sep);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
.nav-in,.st-in{display:flex;align-items:center;min-height:48px;gap:4px}
.nav h1{flex:1;text-align:center;font-size:17px;font-weight:600;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.nav-btn{background:none;border:0;color:var(--blue);font-size:17px;min-width:48px;min-height:48px;padding:0 4px;display:flex;align-items:center;justify-content:center;white-space:nowrap}
.nav-btn.icon{padding:0}
.nb-sp{display:block;min-width:48px}
.scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.pad{padding:14px max(16px,env(safe-area-inset-left,0px)) 28px max(16px,env(safe-area-inset-left,0px))}
.tabbar{flex:none;background:var(--bar);border-top:.5px solid var(--sep);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
.tabbar-in{display:flex}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 0 5px;font-size:10px;color:var(--fg2);background:none;border:0;min-height:50px}
.tab.on{color:var(--blue)}
/* колоды */
.colhead{display:flex;align-items:center;font-size:12px;color:var(--fg2);padding:0 0 6px;padding-left:0;padding-right:0}
.colhead span{text-align:right}
.colhead .grow{flex:1}
.cn,.cl,.cr{width:54px}
.group{background:var(--cell);border-radius:12px;margin:0 0 22px;overflow:hidden}
.row{display:flex;align-items:center;min-height:48px;padding:6px 16px;border-bottom:.5px solid var(--sep);gap:10px}
.row:last-child{border-bottom:0}
.row.col{flex-direction:column;align-items:stretch;padding:14px 16px;gap:10px}
.rowtop{display:flex;align-items:center}
.row small{display:block;font-size:12px;color:var(--fg2);margin-top:1px}
.grow{flex:1;min-width:0}
.deck{padding-left:8px;padding-right:0;cursor:pointer;min-height:52px}
.deck:active{background:var(--fill)}
.disc{width:30px;height:44px;display:flex;align-items:center;justify-content:center;color:var(--fg2);font-size:15px;flex:none}
.dname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cnt{width:54px;text-align:right;padding-right:14px;font-variant-numeric:tabular-nums;font-weight:500}
.cnt.n{color:var(--blue)}.cnt.l{color:var(--red)}.cnt.r{color:var(--green)}
.cnt.z{color:var(--fg2);opacity:.5;font-weight:400}
.empty{padding:60px 8px;text-align:center;color:var(--fg2)}
.empty h2{color:var(--fg);margin:12px 0 6px;font-size:22px}
.empty p{margin:0 0 22px;line-height:1.4}
.empty-ic{color:var(--fg2);opacity:.7}
.empty-ic svg{width:56px;height:56px}
.btn-main{display:block;width:100%;height:52px;border-radius:13px;border:0;background:var(--blue);color:#fff;font-size:17px;font-weight:600;margin:0 0 22px}
.btn-main:disabled{background:var(--fill);color:var(--fg2)}
.ov-counts{display:flex;justify-content:center;gap:30px;margin:18px 0 26px}
.ov-counts div{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;color:var(--fg2)}
.ov-counts b{font-size:40px;font-weight:600;font-variant-numeric:tabular-nums;width:auto;padding:0;text-align:center}
.muted{color:var(--fg2);line-height:1.4}
.center{text-align:center}
.num{width:88px;height:36px;border:0;border-radius:9px;background:var(--fill);color:var(--fg);font-size:17px;text-align:right;padding:0 10px}
.num.wide{width:120px}
.row-btn{display:block;width:100%;background:none;border:0;padding:14px 16px;font-size:17px;text-align:left;color:var(--blue)}
.row-btn.danger,.sbtn.danger{color:var(--red)}
.gh{font-size:13px;font-weight:400;color:var(--fg2);text-transform:uppercase;letter-spacing:.04em;margin:0 0 7px 16px}
.foot{font-size:13px;color:var(--fg2);line-height:1.4;margin:-8px 16px 0}
.switch{position:relative;width:51px;height:31px;flex:none}
.switch input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0}
.switch i{position:absolute;inset:0;border-radius:16px;background:var(--fill);transition:background .2s}
.switch i::after{content:"";position:absolute;left:2px;top:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.3);transition:transform .2s}
.switch input:checked + i{background:var(--green)}
.switch input:checked + i::after{transform:translateX(20px)}
input[type=range]{width:100%;accent-color:var(--blue)}
.preview{text-align:center;padding:8px 0;color:var(--fg);line-height:1.3}
.big{font-size:44px;font-weight:600;font-variant-numeric:tabular-nums}
.forecast{display:flex;align-items:flex-end;gap:8px;height:120px;padding-top:6px}
.fbar{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:stretch;text-align:center;font-size:11px;color:var(--fg2);gap:3px}
.fbar i{display:block;background:var(--green);border-radius:4px 4px 0 0;min-height:2px}
.fbar .fv{font-variant-numeric:tabular-nums}
.stack{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--fill)}
.stack i{display:block;height:100%}
.lg{display:flex;align-items:center;gap:8px;font-size:15px}
.lg span{flex:1}.lg b{font-variant-numeric:tabular-nums;font-weight:500}
.lg i{width:12px;height:12px;border-radius:4px;flex:none}
.s-nw{background:var(--blue)}.s-lr{background:var(--red)}.s-yg{background:#8bd17c}.s-mt{background:var(--green)}.s-sp{background:var(--fg2)}
/* повторение */
.study{background:var(--cardbg)}
.st-in{justify-content:space-between}
.st-r{display:flex}
.counts{display:flex;gap:14px;font-size:18px;font-weight:600}
.counts .cnt{width:auto;padding:0;font-weight:600;padding-bottom:1px;border-bottom:2px solid transparent}
.counts .cnt.cur{border-bottom-color:currentColor}
.cardwrap{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;position:relative}
.cardhost{position:relative;min-height:100%}
.cardframe{display:block;width:100%;border:0;background:transparent}
.cardframe.pending{position:absolute;left:0;top:0;visibility:hidden}
.done{padding:70px 24px;text-align:center;color:var(--fg)}
.done h2{margin:10px 0 6px}
.done p{color:var(--fg2);margin:0}
.done-ic{width:64px;height:64px;line-height:64px;border-radius:50%;background:var(--good);color:var(--green);font-size:32px;margin:0 auto}
.st-bot{flex:none;background:var(--bar);border-top:.5px solid var(--sep);padding-top:8px;padding-bottom:8px}
.btn-show{display:block;width:100%;height:54px;border-radius:14px;border:0;background:var(--blue);color:#fff;font-size:18px;font-weight:600}
.ans{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:58px;border-radius:14px;border:0;font-size:16px;font-weight:600;min-width:0;padding:0 2px}
.ab small{font-size:12px;font-weight:500;opacity:.9}
.ab1{background:var(--again);color:var(--red)}.ab2{background:var(--hard);color:var(--orange)}.ab3{background:var(--good);color:var(--green)}.ab4{background:var(--easy);color:var(--blue)}
.ab:active{filter:brightness(.92)}
/* шторка */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheet{width:100%;max-width:520px;background:var(--cell);border-radius:18px 18px 0 0;padding:20px max(16px,env(safe-area-inset-left,0px)) calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;max-height:90%;overflow:auto}
.sheet h2{margin:0;font-size:20px}
.sheet p{margin:0}
.sheet .row{padding-left:0;padding-right:0;border:0}
.sbtn{display:flex;align-items:center;justify-content:center;height:50px;border-radius:13px;border:0;background:var(--fill);color:var(--blue);font-size:17px;font-weight:500;text-align:center}
.sbtn.primary{background:var(--blue);color:#fff;font-weight:600}
.sbtn:disabled{opacity:.4}
.prog{height:8px;border-radius:4px;background:var(--fill);overflow:hidden}
.prog i{display:block;height:100%;background:var(--blue);transition:width .2s}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:rgba(40,40,42,.94);color:#fff;padding:10px 16px;border-radius:12px;font-size:15px;z-index:80;max-width:86%;text-align:center}
/* просмотр картинки */
.lb{position:fixed;inset:0;background:#000;z-index:70;display:flex;flex-direction:column}
.lb[hidden]{display:none}
.lb-scroll{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch}
.lb-scroll img{display:block}
.lb-x{position:absolute;top:calc(8px + env(safe-area-inset-top,0px));right:calc(10px + env(safe-area-inset-right,0px));width:44px;height:44px;border-radius:22px;border:0;background:rgba(60,60,60,.85);color:#fff;font-size:20px;z-index:2}
.lb-hint{position:absolute;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));text-align:center;color:#ddd;font-size:13px;pointer-events:none;text-shadow:0 1px 3px #000}
.cloud{color:var(--blue)}.cloud.off{color:var(--fg2)}.cloud.error{color:var(--red)}.cloud.sync{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.warn{color:var(--orange);font-size:14px;line-height:1.4}
.syncbar{position:fixed;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(72px + env(safe-area-inset-bottom,0px));background:var(--cell);border:.5px solid var(--sep);border-radius:12px;padding:10px 14px;display:flex;flex-direction:column;gap:8px;font-size:14px;z-index:60;box-shadow:0 4px 16px rgba(0,0,0,.18)}
.syncbar[hidden]{display:none}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
<div id="app"></div>
<div id="sheet"></div>
<div id="lb" class="lb" hidden></div>
<div id="syncbar" class="syncbar" hidden></div>
<div id="toast" class="toast" hidden></div>
<script>
/* ===== CORE: ZIP, .apkg, шаблоны Anki, планировщик ===== */
var Core = (function () {
  'use strict';
  var deps = { getSQL: null, inflateRaw: null, zstd: null };
  function setDeps(d) { for (var k in d) deps[k] = d[k]; }

  /* ---------- ZIP (с ZIP64), чтение кусками, без загрузки всего файла в память ---------- */
  async function readSlice(file, a, b) { return new Uint8Array(await file.slice(a, b).arrayBuffer()); }
  function u16(dv, o) { return dv.getUint16(o, true); }
  function u32(dv, o) { return dv.getUint32(o, true); }
  function u64(dv, o) { return dv.getUint32(o, true) + dv.getUint32(o + 4, true) * 4294967296; }
  var utf8 = new TextDecoder('utf-8');

  function ZipReader(file) { this.file = file; this.map = new Map(); }
  ZipReader.prototype.open = async function () {
    var size = this.file.size;
    if (size < 22) throw new Error('The file is empty or not an .apkg archive');
    var tailLen = Math.min(size, 65535 + 22 + 20);
    var tail = await readSlice(this.file, size - tailLen, size);
    var dv = new DataView(tail.buffer, tail.byteOffset, tail.byteLength);
    var e = -1, i;
    for (i = tail.length - 22; i >= 0; i--) { if (dv.getUint32(i, true) === 0x06054b50) { e = i; break; } }
    if (e < 0) throw new Error('This is not a ZIP archive. Choose an .apkg file.');
    var total = u16(dv, e + 10), cdSize = u32(dv, e + 12), cdOff = u32(dv, e + 16);
    if (total === 0xFFFF || cdSize === 0xFFFFFFFF || cdOff === 0xFFFFFFFF) {
      var loc = e - 20;
      if (loc < 0 || dv.getUint32(loc, true) !== 0x07064b50) throw new Error('Could not read the ZIP64 archive');
      var zoff = u64(dv, loc + 8);
      var z = await readSlice(this.file, zoff, zoff + 56);
      var zd = new DataView(z.buffer, z.byteOffset, z.byteLength);
      if (zd.getUint32(0, true) !== 0x06064b50) throw new Error('The ZIP64 archive is damaged');
      total = u64(zd, 32); cdSize = u64(zd, 40); cdOff = u64(zd, 48);
    }
    var cd = await readSlice(this.file, cdOff, cdOff + cdSize);
    var cv = new DataView(cd.buffer, cd.byteOffset, cd.byteLength);
    var p = 0;
    while (p + 46 <= cd.length && cv.getUint32(p, true) === 0x02014b50) {
      var method = u16(cv, p + 10), csize = u32(cv, p + 20), usize = u32(cv, p + 24);
      var nl = u16(cv, p + 28), xl = u16(cv, p + 30), cl = u16(cv, p + 32), off = u32(cv, p + 42);
      var name = utf8.decode(cd.subarray(p + 46, p + 46 + nl));
      var xp = p + 46 + nl, xend = xp + xl;
      while (xp + 4 <= xend) {
        var id = u16(cv, xp), sz = u16(cv, xp + 2), q = xp + 4;
        if (id === 1) {
          if (usize === 0xFFFFFFFF) { usize = u64(cv, q); q += 8; }
          if (csize === 0xFFFFFFFF) { csize = u64(cv, q); q += 8; }
          if (off === 0xFFFFFFFF) { off = u64(cv, q); q += 8; }
        }
        xp += 4 + sz;
      }
      this.map.set(name, { method: method, csize: csize, usize: usize, off: off });
      p += 46 + nl + xl + cl;
    }
  };
  ZipReader.prototype.has = function (n) { return this.map.has(n); };
  ZipReader.prototype.read = async function (name) {
    var en = this.map.get(name);
    if (!en) throw new Error('The archive has no file ' + name);
    var h = await readSlice(this.file, en.off, en.off + 30);
    var hv = new DataView(h.buffer, h.byteOffset, h.byteLength);
    var start = en.off + 30 + u16(hv, 26) + u16(hv, 28);
    var data = await readSlice(this.file, start, start + en.csize);
    if (en.method === 0) return data;
    if (en.method === 8) return await deps.inflateRaw(data);
    throw new Error('Unsupported compression in the archive');
  };

  /* ---------- protobuf (минимум) ---------- */
  function pbParse(buf) {
    var i = 0, n = buf.length, out = [];
    function varint() { var r = 0, s = 0, b; do { b = buf[i++]; r += (b & 0x7f) * Math.pow(2, s); s += 7; } while ((b & 0x80) && i < n); return r; }
    while (i < n) {
      var key = varint(), f = Math.floor(key / 8), w = key % 8;
      if (w === 0) out.push({ f: f, v: varint() });
      else if (w === 2) { var len = varint(); out.push({ f: f, v: buf.subarray(i, i + len) }); i += len; }
      else if (w === 1) i += 8;
      else if (w === 5) i += 4;
      else break;
    }
    return out;
  }
  function pbStr(fields, f) { var x = fields.find(function (q) { return q.f === f && q.v instanceof Uint8Array; }); return x ? utf8.decode(x.v) : ''; }
  function pbNum(fields, f, d) { var x = fields.find(function (q) { return q.f === f && typeof q.v === 'number'; }); return x ? x.v : d; }

  function maybeZstd(b) {
    if (b.length > 4 && b[0] === 0x28 && b[1] === 0xb5 && b[2] === 0x2f && b[3] === 0xfd) {
      if (!deps.zstd) throw new Error('The zstd decompressor is not loaded');
      return deps.zstd(b);
    }
    return b;
  }

  /* ---------- Разбор .apkg ---------- */
  function iter(db, sql, map) {
    var st = db.prepare(sql), done = false;
    return {
      next: function (n) {
        var out = [];
        while (!done && out.length < n) { if (st.step()) out.push(map(st.get())); else { done = true; st.free(); } }
        return out;
      },
      free: function () { if (!done) { done = true; st.free(); } }
    };
  }
  function allRows(db, sql) { var st = db.prepare(sql), out = []; while (st.step()) out.push(st.get()); st.free(); return out; }

  async function openApkg(file) {
    var zip = new ZipReader(file); await zip.open();
    var colName = ['collection.anki21b', 'collection.anki21', 'collection.anki2'].find(function (n) { return zip.has(n); });
    if (!colName) throw new Error('No Anki collection in the file. An .apkg or .colpkg export is needed.');
    var raw = maybeZstd(await zip.read(colName));
    var SQL = await deps.getSQL();
    var db = new SQL.Database(raw);
    raw = null;
    var tables = allRows(db, "SELECT name FROM sqlite_master WHERE type='table'").map(function (r) { return r[0]; });
    var isNew = tables.indexOf('notetypes') >= 0;
    var models = [], decks = [], crt = 0;
    var crow = allRows(db, 'SELECT crt FROM col');
    if (crow.length) crt = crow[0][0];

    if (!isNew) {
      var col = allRows(db, 'SELECT models, decks FROM col')[0];
      var mj = JSON.parse(col[0] || '{}'), dj = JSON.parse(col[1] || '{}');
      Object.keys(mj).forEach(function (k) {
        var m = mj[k];
        models.push({
          id: String(m.id || k), name: m.name || 'Type', kind: m.type === 1 ? 'cloze' : 'std', css: m.css || '',
          fields: (m.flds || []).slice().sort(function (a, b) { return a.ord - b.ord; }).map(function (f) { return f.name; }),
          tmpls: (m.tmpls || []).slice().sort(function (a, b) { return a.ord - b.ord; }).map(function (t) { return { name: t.name, qfmt: t.qfmt || '', afmt: t.afmt || '' }; })
        });
      });
      Object.keys(dj).forEach(function (k) { var d = dj[k]; decks.push({ id: String(d.id || k), name: d.name || 'Default', dyn: !!d.dyn }); });
    } else {
      var byId = {};
      allRows(db, 'SELECT id, name, config FROM notetypes NOT INDEXED').forEach(function (r) {
        var cfg = r[2] ? pbParse(r[2]) : [];
        var m = { id: String(r[0]), name: r[1], kind: pbNum(cfg, 1, 0) === 1 ? 'cloze' : 'std', css: pbStr(cfg, 3), fields: [], tmpls: [] };
        byId[m.id] = m; models.push(m);
      });
      var fl = allRows(db, 'SELECT ntid, ord, name FROM fields NOT INDEXED').sort(function (a, b) { return a[1] - b[1]; });
      fl.forEach(function (r) { var m = byId[String(r[0])]; if (m) m.fields.push(r[2]); });
      var tl = allRows(db, 'SELECT ntid, ord, name, config FROM templates NOT INDEXED').sort(function (a, b) { return a[1] - b[1]; });
      tl.forEach(function (r) {
        var m = byId[String(r[0])]; if (!m) return;
        var c = r[3] ? pbParse(r[3]) : [];

    for (var s of ['decks', 'models', 'notes', 'cards', 'guids', 'media', 'log']) await dbClear(s);
    S.decks.clear(); S.models.clear(); S.cards = []; S.byNid = new Map(); S.noteCache.clear(); S.mcache.clear(); S.cssCache.clear();
    S.daily = { day: 0, by: {} }; await setMeta('daily', S.daily);
  }

  /* ---------- События ---------- */
  var acts = {
    tab: function (el) { var v = el.dataset.v; if (v === 'decks') renderDecks(); else if (v === 'stats') renderStats(); else renderSettings(); },
    back: function () { renderDecks(); },
    openDeck: function (el) { renderOverview(Number(el.dataset.id)); },
    toggle: function (el, ev) {
      ev.stopPropagation();
      var d = S.decks.get(Number(el.dataset.id)); if (!d) return;
      d.collapsed = !d.collapsed; enqueue(function () { return dbPutMany('decks', [d]); }); renderDecks();
    },
    study: function () { startStudy(S.view.did); },
    exitStudy: exitStudy,
    showAns: showAnswer,
    rate: function (el) { rate(Number(el.dataset.r)); },
    undo: undo,
    more: function () {
      var mk = S.cur ? '' : ' disabled';
      openSheet('<h2>Actions</h2><button class="sbtn"' + mk + ' data-act="mark">Mark / unmark</button><button class="sbtn"' + mk + ' data-act="bury">Bury card until tomorrow</button><button class="sbtn danger"' + mk + ' data-act="suspend">Suspend card</button><button class="sbtn" data-act="closeSheet">Cancel</button>');
    },
    mark: function () { closeSheet(); toggleMark(); },
    bury: function () { closeSheet(); suspendOrBury('bury'); },
    suspend: function () { closeSheet(); suspendOrBury('sus'); },
    import: openImport,
    closeSheet: function (el, ev) { closeSheet(); },
    confirmOk: function () { var f = S.confirmFn; closeSheet(); if (f) f(); },
    delDeck: function (el) {
      var id = Number(el.dataset.id), d = S.decks.get(id);
      confirmSheet('Delete deck?', 'Deck “' + d.name + '” (including subdecks), its cards and images will be deleted from this device.', 'Delete', async function () { await deleteDeck(id); renderDecks(); toast('Deck deleted'); });
    },
    wipe: function () { confirmSheet('Delete all data?', 'All decks, cards, images and progress will be deleted from this device. This cannot be undone.', 'Delete everything', async function () { await wipeAll(); renderSettings(); toast('Data deleted'); }); },
    closeLb: closeLightbox
  };
  document.addEventListener('click', function (ev) {
    var t = ev.target;
    if (t.closest && t.closest('#lbi') && !$('#lb').hidden) { lbTap(ev); return; }
    if (t.classList && t.classList.contains('sheet-bg')) { closeSheet(); return; }
    var a = t.closest && t.closest('[data-act]');
    if (!a) return;
    var f = acts[a.dataset.act]; if (f) f(a, ev);
  });
  function saveCfg() { return setMeta('cfg', S.cfg); }
  function parseSteps(v) { var a = String(v).split(/[\s,;]+/).map(Number).filter(function (x) { return x > 0 && isFinite(x); }); return a.length ? a : null; }
  document.addEventListener('change', async function (ev) {
    var t = ev.target;
    if (t.id === 'pick') {
      var files = Array.prototype.slice.call(t.files || []), keep = !!($('#keepProg') && $('#keepProg').checked);
      if (files.length) runImport(files, keep);
      return;
    }
    if (t.dataset.cfg) {
      var k = t.dataset.cfg;
      if (t.type === 'checkbox') S.cfg[k] = t.checked;
      else { var v = Number(t.value); if (isFinite(v) && v >= 0) S.cfg[k] = v; }
      await saveCfg(); return;
    }
    if (t.dataset.cfgsteps) {
      var st = parseSteps(t.value), k2 = t.dataset.cfgsteps;
      if (st) S.cfg[k2] = st; t.value = S.cfg[k2].join(' '); await saveCfg(); return;
    }
    if (t.dataset.deckopt) {
      var d = S.decks.get(Number(t.dataset.id)), n = Math.max(0, Math.floor(Number(t.value)));
      if (d && isFinite(n)) { d[t.dataset.deckopt] = n; enqueue(function () { return dbPutMany('decks', [d]); }); }
      t.value = d ? d[t.dataset.deckopt] : 0;
    }
  });
  document.addEventListener('input', function (ev) {
    var t = ev.target;
    if (t.id === 'fs') {
      S.cfg.fontScale = Number(t.value); $('#fsval').textContent = t.value + '%'; $('#fsprev').style.fontSize = (20 * t.value / 100) + 'px';
      clearTimeout(S.fst); S.fst = setTimeout(saveCfg, 300);
    }
  });
  document.addEventListener('keydown', function (ev) {
    if (S.view.name !== 'study' || ev.target.tagName === 'INPUT' || ev.metaKey || ev.ctrlKey) return;
    if (ev.key === ' ' || ev.key === 'Enter') { ev.preventDefault(); if (S.cur) { if (S.cur.side === 'q') showAnswer(); else rate(3); } }
    else if (S.cur && S.cur.side === 'a' && '1234'.indexOf(ev.key) >= 0 && ev.key) rate(Number(ev.key));
    else if (ev.key === 'z') undo();
  });

  /* ---------- Запуск ---------- */
  async function boot() {
    setApp('<div class="boot">Loading…</div>');
    try {
      idb = await openDB();
    } catch (e) {
      S.storageOk = false; idb = null;
      setApp('<div class="screen"><div class="empty"><h2>Browser storage unavailable</h2><p>The app needs local storage to keep your decks. Open the page in a regular (non-private) Safari tab.</p></div></div>');
      return;
    }
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { }
    try { S.boots = ((await dbGet('meta', 'boots')) || 0) + 1; await setMeta('boots', S.boots); } catch (e) { }
    try {
      var cfg = await dbGet('meta', 'cfg'); if (cfg) S.cfg = Object.assign({}, CFG0, cfg);
      var daily = await dbGet('meta', 'daily'); if (daily) S.daily = daily;
      var ni = await dbGet('meta', 'nextId'); S.nextId = ni || (Date.now());
      (await dbAll('decks')).forEach(function (d) { S.decks.set(d.id, d); });
      (await dbAll('models')).forEach(function (m) { S.models.set(m.id, m); });
      S.cards = await dbAll('cards');
      S.cards.forEach(function (c) { var a = S.byNid.get(c.nid); if (!a) S.byNid.set(c.nid, a = []); a.push(c); });
    } catch (e) { console.error(e); toast('Error reading data'); }
    renderDecks();
  }
  if (window.__TEST) window.__TEST_API = { S: S, importOne: importOne, startStudy: startStudy, rate: rate, showAnswer: showAnswer, undo: undo, renderDecks: renderDecks, renderOverview: renderOverview, renderStats: renderStats, renderSettings: renderSettings, deleteDeck: deleteDeck, libsReady: function () { libP.all = Promise.resolve(); }, boot: boot, acts: acts, computeCounts: computeCounts, buildQueue: buildQueue, buildCard: buildCard, openImport: openImport };
  if (!window.__TEST) boot();
})();
</script>
